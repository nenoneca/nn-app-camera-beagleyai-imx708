# BeagleY-AI card, layout "ab-v1" (whole-system A/B OTA).
#
#   0x000000  MBR, disk signature 0x6e6e6279 -> PARTUUIDs 6e6e6279-0N
#   0x100000  U-Boot env        (256 KiB, not in the partition table)
#   0x140000  U-Boot env, redundant copy
#   4 MiB     p1 boot     FAT   boot chain ONLY: tiboot3, tispl, u-boot.img
#             p2 rootfs_a ext4  the system: rootfs + /boot (kernel, dtbs, extlinux)
#             p3 rootfs_b       empty until the first OTA writes it
#             p4 nn-data  ext4  what must survive a slot swap; grown to the
#                               end of the card on first boot
#
# MBR, not GPT: every TI/BeagleBoard SD recipe for this ROM is msdos with the
# boot FAT flagged bootable, and the ROM's FAT loader has already been fussy
# twice (check-boot-order.py).  MBR has exactly the four primaries we need.
# Slots are addressed by PARTUUID only: both hold the same ext4 image, so
# their filesystem label and UUID are identical.

image boot.vfat {
	vfat {
		files = {
			"tiboot3.bin",
			"tispl.bin",
			"u-boot.img",
			"nn-boot-chain",
		}

		label = "boot"
	}

	size = 64M
}

image sdcard.img {
	hdimage {
		partition-table-type = "mbr"
		disk-signature = 0x6e6e6279
	}

	partition uboot-env {
		in-partition-table = "no"
		offset = 0x100000
		image = "uboot-env.bin"
	}

	partition uboot-env-redund {
		in-partition-table = "no"
		offset = 0x140000
		image = "uboot-env.bin"
	}

	partition boot {
		partition-type = 0xC
		bootable = "true"
		offset = 4M
		image = "boot.vfat"
	}

	partition rootfs_a {
		partition-type = 0x83
		image = "rootfs.ext4"
		size = 1500M
	}

	partition rootfs_b {
		partition-type = 0x83
		size = 1500M
	}

	partition nn-data {
		partition-type = 0x83
		image = "nn-data.ext4"
	}
}
