# LXC config for the trimmed TI edgeai container.
#
# WHAT THIS CONTAINER IS FOR.  It exists to solve an ABI problem, not a
# security one: TI's userspace is built against Arago's glibc and GStreamer
# 1.22.12, and our Buildroot rootfs has neither.  Bundling that runtime is the
# whole point.  Everything in here is our own code, so the config is
# deliberately permissive where isolation would only add failure modes.
#
# lxc.rootfs.path is filled in by nn-edgeai.service -- the container lives on
# nn-data, which is mounted at /opt/nn-app.

lxc.uts.name = edgeai
lxc.arch = linux64

# No network namespace: the camera app talks to the hub, and a separate
# namespace would mean bridging, addressing and a second DHCP client for no
# benefit.  Sharing the host's stack is what the proven setup did.
lxc.net.0.type = none

lxc.mount.auto = proc:mixed sys:ro cgroup:mixed

# The whole of /dev, bound in.
#
# The obvious thing is to bind each node -- /dev/video2, /dev/media0 and so on
# -- but v4l2 and remoteproc numbering on this SoC CHANGES BETWEEN BOOTS (it
# follows driver probe order; the capture node was video0 on one boot and
# video2 on the next).  A per-node list would therefore be correct on the
# bench and wrong in the field, and the failure is a camera that streams
# nothing rather than an error.  The container also has to see /sys to resolve
# nodes by name, which is already bound above.
lxc.mount.entry = /dev dev none bind,create=dir 0 0
lxc.cgroup2.devices.allow = a
lxc.cgroup.devices.allow = a

# Our own application, models and state, from the host.  /opt/nn-app is
# nn-data: the app bundle (app/current), the swappable model (models/current)
# and this very container all live there and survive a slot swap.  /var/lib/nn
# is the provisioning KV -- hub endpoint, stream key, device identity -- which
# nn-camera reads directly, so there is no env file and no placeholder.
lxc.mount.entry = /opt/nn-app opt/nn-app none bind,create=dir 0 0
lxc.mount.entry = /var/lib/nn var/lib/nn none bind,create=dir 0 0

# Keep the container alive; the camera app is started into it with
# lxc-attach, the same shape the working card used.
#
# NOT `/bin/sh -c "while true; ..."`: liblxc splits this value on whitespace
# and does NOT honour shell quoting, so the quoted script arrives mangled and
# the container's init dies with
#     true;: line 0: syntax error: unterminated quoted string
# A single argv with no quoting is the only thing that survives.  busybox
# sleep takes the seconds (about 68 years); "infinity" is a GNU-ism it lacks.
lxc.init.cmd = /bin/sleep 2147483647

# NO lxc.apparmor.profile here.  This LXC is built without AppArmor support,
# and an unsupported key is not ignored -- liblxc fails the whole config parse
# ("Built without AppArmor support" ... "Failed to load config for edgeai"),
# so the container never starts at all.  Defensive settings are not free.
